name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check hindsight evals tests
          ruff format --check hindsight evals tests
      - name: Tests (no network)
        run: pytest
      - name: Offline evals (baselines must still run)
        run: python -m evals.run --systems heuristic --out "$RUNNER_TEMP/evals.json"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hindsight .
      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 --name hindsight hindsight
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/insights \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['counts']['total'] == 36, d['counts']"
          curl -fs localhost:8000/decisions/1 | grep -q 'id="root"'
          docker logs hindsight
