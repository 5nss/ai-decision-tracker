[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight"
version = "2.0.0"
description = "A decision journal that grades your judgment: calibration scoring and AI assumption audits."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-genai>=3.0,<4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["hindsight*", "evals*"]

[tool.setuptools.package-data]
hindsight = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: `ruff format` owns line length; long lines left are prompt text and URLs.
# B008: FastAPI's `Query(...)`/`Depends(...)` defaults are the framework's idiom.
ignore = ["E501", "B008"]
