<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hindsight: a decision journal that grades your judgment with calibration scores and AI assumption audits."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hindsight</title>
    <script>
      // Apply a saved theme before first paint, so dark mode never flashes light.
      try {
        const theme = localStorage.getItem("hindsight.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
